<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Скриншоты — Sunset Launcher</title>
  <meta name="theme-color" content="#151413" />
  <meta name="description" content="Скриншоты Sunset Launcher: библиотека сборок, каталог Modrinth и CurseForge, установленные моды, аккаунты, настройки и живая консоль." />
  <link rel="canonical" href="https://sunset-launcher.github.io/screenshots.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Скриншоты — Sunset Launcher" />
  <meta property="og:url" content="https://sunset-launcher.github.io/screenshots.html" />
  <meta property="og:image" content="https://sunset-launcher.github.io/assets/screenshots/library.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/logo.ico" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20261125a" />
</head>
<body data-page="screenshots">
  <div id="app-header"></div>

  <main class="page">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow enter" style="--d:0" data-i18n="nav.screens">Скриншоты</span>
        <h1 class="enter" style="--d:1" data-i18n="sp.title">Интерфейс Sunset Launcher</h1>
        <p class="lead enter" style="--d:2" data-i18n="sp.lead">Выберите любой экран для просмотра в полном размере или листайте стрелками клавиатуры</p>
      </div>
    </section>

    <section class="section tight">
      <div class="container">
        <div class="filter-bar enter" style="--d:3" role="tablist" aria-label="Filter screenshots">
          <button class="filter-btn active" type="button" data-filter="all" data-i18n="scr.fAll">Все</button>
          <button class="filter-btn" type="button" data-filter="ui" data-i18n="scr.fUi">Интерфейс</button>
          <button class="filter-btn" type="button" data-filter="mods" data-i18n="scr.fMods">Моды</button>
          <button class="filter-btn" type="button" data-filter="system" data-i18n="scr.fSys">Система</button>
        </div>

        <div class="gallery" id="gallery">
          <figure class="shot wide" tabindex="0" role="button" data-cat="ui" data-src="assets/screenshots/library.jpg">
            <img src="assets/screenshots/library.jpg" width="1024" height="549" alt="Sunset Launcher — библиотека сборок и быстрый запуск" />
            <figcaption><b data-i18n="scr.t1">Библиотека</b><span data-i18n="scr.d1">Все сборки и быстрый запуск</span></figcaption>
          </figure>
          <figure class="shot" tabindex="0" role="button" data-cat="mods" data-src="assets/screenshots/discover.jpg">
            <img src="assets/screenshots/discover.jpg" width="1024" height="549" alt="Sunset Launcher — каталог модов и модпаков Modrinth" loading="lazy" />
            <figcaption><b data-i18n="scr.t2">Modrinth</b><span data-i18n="scr.d2">Каталог модов и модпаков</span></figcaption>
          </figure>
          <figure class="shot" tabindex="0" role="button" data-cat="mods" data-src="assets/screenshots/mods.jpg">
            <img src="assets/screenshots/mods.jpg" width="1024" height="549" alt="Sunset Launcher — установленные файлы сборки" loading="lazy" />
            <figcaption><b data-i18n="scr.t3">Моды</b><span data-i18n="scr.d3">Установленные файлы сборки</span></figcaption>
          </figure>
          <figure class="shot" tabindex="0" role="button" data-cat="system" data-src="assets/screenshots/accounts.jpg">
            <img src="assets/screenshots/accounts.jpg" width="1024" height="549" alt="Sunset Launcher — аккаунты Microsoft, Ely.by и Offline" loading="lazy" />
            <figcaption><b data-i18n="scr.t4">Аккаунты</b><span data-i18n="scr.d4">Microsoft, Ely.by и офлайн</span></figcaption>
          </figure>
          <figure class="shot" tabindex="0" role="button" data-cat="system" data-src="assets/screenshots/settings.jpg">
            <img src="assets/screenshots/settings.jpg" width="1024" height="549" alt="Sunset Launcher — темы, Java и локализация" loading="lazy" />
            <figcaption><b data-i18n="scr.t5">Настройки</b><span data-i18n="scr.d5">Темы, Java и локализация</span></figcaption>
          </figure>
          <figure class="shot wide" tabindex="0" role="button" data-cat="system" data-src="assets/screenshots/console.png">
            <img src="assets/screenshots/console.png" width="1024" height="549" alt="Sunset Launcher — поток stdout/stderr в реальном времени" loading="lazy" />
            <figcaption><b data-i18n="scr.t6">Консоль</b><span data-i18n="scr.d6">Поток stdout/stderr в реальном времени</span></figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-card">
          <div class="cta-copy">
            <h2 data-i18n="dl.title">Скачайте Sunset Launcher</h2>
            <p data-i18n="dl.sub">Бесплатный open-source лаунчер под лицензией MIT для Windows, Linux и macOS</p>
          </div>
          <div class="hero-cta">
            <a href="download.html" class="btn btn-primary btn-lg" data-i18n="nav.download">Скачать</a>
            <a href="features.html" class="btn btn-ghost btn-lg" data-i18n="nav.features">Возможности</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
  <script src="script.js?v=20261125a"></script>
</body>
</html>
