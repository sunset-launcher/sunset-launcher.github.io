<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Sunset Launcher</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#120e18" />
  <base href="/" />
  <link rel="icon" href="assets/logo.ico" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script>try{const t=localStorage.getItem("theme");if(t&&t!=="sunset")document.documentElement.dataset.theme=t;}catch{}</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="404">
  <div id="app-header"></div>

  <main class="page">
    <section class="page-hero notfound">
      <div class="container">
        <div class="enter" style="--d:0">
          <div class="cube-wrap static" aria-hidden="true">
            <div class="cube broken">
              <i class="f top"></i><i class="f front"></i><i class="f right"></i>
              <i class="f back"></i><i class="f left"></i><i class="f bottom"></i>
            </div>
          </div>
        </div>
        <h1 class="enter big404" style="--d:1"><span class="grad shimmer">404</span></h1>
        <p class="lead enter" style="--d:2" data-i18n="nf.lead">Этот чанк ещё не сгенерирован. Похоже, страница потерялась где-то в Незере.</p>
        <div class="cmdline enter" style="--d:3"><span class="c">$</span> /tp @s <span class="typed">~ ~ ~</span><span class="caret"></span></div>
        <div class="hero-cta center-row enter" style="--d:4">
          <a href="index.html" class="btn btn-primary btn-lg magnetic" data-i18n="nf.home">На главную</a>
          <a href="download.html" class="btn btn-ghost btn-lg" data-i18n="nav.download">Скачать</a>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
  <script src="script.js"></script>
</body>
</html>
